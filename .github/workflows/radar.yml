name: Open Source Radar

on:
  schedule:
    # 01:30 UTC = 07:00 IST daily
    - cron: "30 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: open-source-radar
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Record starting commit
        id: pre_run
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        run: |
          git config user.name "Open Source Radar"
          git config user.email "subhamojha9@gmail.com"

      - name: Run the radar agent
        uses: anthropics/claude-code-action@v1
        with:
          # Authenticates with Sourav's Claude Max plan (claude setup-token) instead of
          # separately-billed API usage. See README.md "One-time setup" for why, and the
          # tradeoff this implies (shared usage pool with interactive Claude Code use).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Full Claude output is hidden from the log by default (the action's own
          # security default). This repo is private and single-user, so the tradeoff
          # is worth it: without this, a failure shows only a generic is_error:true
          # with no explanation, which is useless for an unattended daily job.
          show_full_output: true
          prompt: |
            Read AGENT.md in this repository in full. It is the complete, authoritative
            operating spec for this run. Follow it exactly — it overrides any assumption
            you would otherwise make.

            Read state.json for context on prior runs. Grep index.jsonl for dedupe —
            do NOT read catalog.json in full, it grows without bound.

            Execute today's run per AGENT.md sections 3-20.

            Finish with the end-of-run checklist in AGENT.md section 23: update
            catalog.json, catalog.md, index.jsonl, state.json, project files, and
            today's daily digest. Validate every JSON file parses before finishing.

            Then commit your changes locally:
              git add -A
              git commit -m "radar: $(date -u +%F) — automated run"
            Do NOT run git push — a separate workflow step handles that.
            If there is nothing new to report, still update state.json's last_run
            timestamp and commit that, so the next run knows this one completed
            rather than silently failing.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 80
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Push changes
        if: always()
        run: |
          if git log origin/main..HEAD --oneline | grep -q .; then
            git push origin HEAD:main
            echo "pushed $(git rev-parse HEAD)"
          else
            echo "nothing new to push"
          fi

      - name: Post today's digest as a GitHub Issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TODAY=$(date -u +%F)
          DIGEST="daily/${TODAY}.md"
          TITLE="Open Source Radar — ${TODAY}"
          FAIL_TITLE="Open Source Radar — ${TODAY} — run did not complete"

          # Guard against duplicate issues when this workflow runs more than once
          # in a day (manual re-dispatch, retries). Skip entirely if today's issue
          # (success or failure variant) already exists and is open.
          EXISTING=$(gh issue list --state open --json title,number \
            --jq --arg t "$TITLE" --arg f "$FAIL_TITLE" \
            '.[] | select(.title == $t or .title == $f) | .number' | head -n1)
          if [ -n "$EXISTING" ]; then
            echo "issue already exists for ${TODAY} (#${EXISTING}); skipping to avoid duplicate"
            echo "run_ok=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -f "$DIGEST" ] && git diff --name-only "${{ steps.pre_run.outputs.sha }}" HEAD -- "$DIGEST" | grep -q .; then
            ISSUE_URL=$(gh issue create \
              --title "$TITLE" \
              --body-file "$DIGEST" \
              || echo "")
            if [ -z "$ISSUE_URL" ]; then
              echo "::warning::issue creation failed; digest is still in the repo at $DIGEST"
            fi
            echo "issue_url=$ISSUE_URL" >> "$GITHUB_OUTPUT"
            echo "run_ok=true" >> "$GITHUB_OUTPUT"
          else
            gh issue create \
              --title "$FAIL_TITLE" \
              --body "The digest at \`$DIGEST\` was not updated by this run (or the run failed before reaching this step). Check the workflow run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              || echo "::warning::could not create failure issue either — check the Actions tab directly"
            echo "run_ok=false" >> "$GITHUB_OUTPUT"
          fi
        id: post_issue

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL not set; skipping Discord notification"
            exit 0
          fi

          TODAY=$(date -u +%F)
          DIGEST="daily/${TODAY}.md"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ISSUE_URL="${{ steps.post_issue.outputs.issue_url }}"
          RUN_OK="${{ steps.post_issue.outputs.run_ok }}"

          if [ "$RUN_OK" = "skipped" ]; then
            echo "issue step was skipped (duplicate for today); skipping Discord notification too"
            exit 0
          fi

          if [ "$RUN_OK" = "true" ] && [ -f "$DIGEST" ]; then
            SUMMARY=$(awk '/^## Executive Summary/{flag=1;next}/^## /{flag=0}flag' "$DIGEST" \
              | sed '/^[[:space:]]*$/d' | head -c 1500 | iconv -f utf-8 -t utf-8 -c)
            TOP=$(awk '/^### 1\. /{print; exit}' "$DIGEST" | sed 's/^### //')
            TITLE_LINE="🔭 Open Source Radar — ${TODAY}"
            if [ -n "$TOP" ]; then
              DESC="$(printf '**Top find:** %s\n\n%s' "$TOP" "$SUMMARY")"
            else
              DESC="$SUMMARY"
            fi
            COLOR=3447003
          else
            TITLE_LINE="⚠️ Open Source Radar — ${TODAY} — run did not complete"
            DESC="The digest was not updated by this run. Check the workflow log: ${RUN_URL}"
            COLOR=15158332
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE_LINE" \
            --arg desc "$DESC" \
            --arg issue_url "$ISSUE_URL" \
            --arg run_url "$RUN_URL" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                description: $desc,
                color: $color,
                url: (if $issue_url != "" then $issue_url else $run_url end),
                fields: [
                  {name: "Full digest", value: (if $issue_url != "" then $issue_url else $run_url end), inline: false}
                ]
              }]
            }')

          curl -sS -X POST -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL" \
            || echo "::warning::Discord notification failed"
